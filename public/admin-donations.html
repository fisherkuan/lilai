<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Donations — Lilai</title>
    <link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/lilai.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<svg width="0" height="0" class="shape-defs" aria-hidden="true" focusable="false">
    <defs>
        <symbol id="shape-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-square" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-triangle" viewBox="0 0 24 24"><path d="M12 1.8 22.6 21.6H1.4Z" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-diamond" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" vector-effect="non-scaling-stroke"/></symbol>
    </defs>
</svg>

<header class="masthead">
    <a class="wordmark" href="/" aria-label="Lilai, home">
        <span class="wordmark-mark" aria-hidden="true">
            <svg class="shape s-circle"><use href="#shape-circle"/></svg>
            <svg class="shape s-square"><use href="#shape-square"/></svg>
            <svg class="shape s-triangle"><use href="#shape-triangle"/></svg>
        </span>
        <span class="wordmark-name">Lilai</span>
    </a>
    <nav class="app-header-links" aria-label="Site links">
        <a class="back-link" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span>Back to the app</span>
        </a>
    </nav>
</header>

<nav class="admin-nav" aria-label="Admin">
    <a href="/admin/events">Events</a>
    <a href="/admin/donations" aria-current="page">Donations</a>
    <a href="/admin/bookings">Booking queue</a>
</nav>

<main class="admin">
    <div class="admin-head">
        <h1 class="admin-title">Donations</h1>
        <p class="admin-sub">Add a donation or expense entry. Use a negative amount for an expense.</p>
    </div>

    <form id="donation-form" class="admin-form" novalidate>
        <div class="field">
            <label for="amount">Amount (€)</label>
            <input type="number" id="amount" name="amount" class="input input-num" step="0.01" placeholder="25.00">
            <p class="row-status is-error" id="amount-error" role="alert" hidden></p>
        </div>

        <div class="field">
            <label for="entry_date">Entry date</label>
            <input type="date" id="entry_date" name="entry_date" class="input">
            <p class="field-hint">Defaults to today if blank.</p>
        </div>

        <div class="field">
            <label for="donator">Donator</label>
            <input type="text" id="donator" name="donator" class="input" placeholder="Name of donor or payer">
        </div>

        <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" class="input" placeholder="Brief description">
        </div>

        <div class="admin-actions">
            <button type="button" class="text-btn" id="reset-btn">Reset</button>
            <button type="submit" class="btn btn-solid">Add entry</button>
        </div>
    </form>

    <p class="state-line" id="form-message" role="status" aria-live="polite" hidden></p>

    <div class="admin-foot">
        <button type="button" class="text-btn" id="clear-key-btn">Clear stored admin key</button>
    </div>
</main>

<footer class="colophon">
    <p>Built by Fisher Kuan</p>
</footer>

<script src="/js/admin-donations.js"></script>
</body>
</html>
