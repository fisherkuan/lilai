<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Events — Lilai</title>
    <link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/lilai.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<svg width="0" height="0" class="shape-defs" aria-hidden="true" focusable="false">
    <defs>
        <symbol id="shape-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-square" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-triangle" viewBox="0 0 24 24"><path d="M12 1.8 22.6 21.6H1.4Z" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-diamond" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" vector-effect="non-scaling-stroke"/></symbol>
    </defs>
</svg>

<header class="masthead">
    <a class="wordmark" href="/" aria-label="Lilai, home">
        <span class="wordmark-mark" aria-hidden="true">
            <svg class="shape s-circle"><use href="#shape-circle"/></svg>
            <svg class="shape s-square"><use href="#shape-square"/></svg>
            <svg class="shape s-triangle"><use href="#shape-triangle"/></svg>
        </span>
        <span class="wordmark-name">Lilai</span>
    </a>
    <nav class="app-header-links" aria-label="Site links">
        <a class="back-link" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            <span>Back to the app</span>
        </a>
    </nav>
</header>

<nav class="admin-nav" aria-label="Admin">
    <a href="/admin/events" aria-current="page">Events</a>
    <a href="/admin/donations">Donations</a>
    <a href="/admin/bookings">Booking queue</a>
</nav>

<main class="admin">
    <div class="admin-head">
        <h1 class="admin-title">Events</h1>
        <p class="admin-sub">Set attendance limits for upcoming events.</p>
    </div>

    <div class="table-wrap">
        <table class="data-table" id="admin-events-table" role="table">
            <thead role="rowgroup">
                <tr role="row">
                    <th role="columnheader">Event</th>
                    <th class="col-num" role="columnheader">Limit</th>
                    <th role="columnheader">Actions</th>
                </tr>
            </thead>
            <tbody id="admin-events-list" role="rowgroup">
                <tr role="row"><td role="cell" colspan="3"><p class="state-line">Loading events…</p></td></tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="colophon">
    <p>Built by Fisher Kuan</p>
</footer>

<script src="/admin.js"></script>
</body>
</html>
