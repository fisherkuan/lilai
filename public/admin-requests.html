<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Apply a saved theme before first paint; the switch itself is js/theme.js. -->
    <script>try{var t=localStorage.getItem("lilaiTheme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <meta name="theme-color" content="#efefea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Requests — Lilai</title>
    <link rel="preload" href="/bauhaus/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/bauhaus/tokens.css">
    <link rel="stylesheet" href="/css/lilai.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<svg width="0" height="0" class="shape-defs" aria-hidden="true" focusable="false">
    <defs>
        <symbol id="shape-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-square" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-triangle" viewBox="0 0 24 24"><path d="M12 1.8 22.6 21.6H1.4Z" vector-effect="non-scaling-stroke"/></symbol>
        <symbol id="shape-diamond" viewBox="0 0 24 24"><path d="M12 1.5 22.5 12 12 22.5 1.5 12Z" vector-effect="non-scaling-stroke"/></symbol>
    </defs>
</svg>

<header class="masthead">
    <a class="wordmark" href="/" aria-label="Lilai, home">
        <span class="wordmark-mark" aria-hidden="true">
            <svg viewBox="88 184 336 144"><circle class="wm-circle" cx="136" cy="232" r="48"/><rect class="wm-square" x="208" y="184" width="96" height="96"/><path class="wm-triangle" d="M376 184L424 280H328Z"/><rect class="wm-base" x="88" y="304" width="336" height="24"/></svg>
        </span>
        <span class="wordmark-name">Lilai</span>
    </a>
</header>

<nav class="admin-nav" aria-label="Admin">
    <a href="/admin/donations">Donations</a>
    <a href="/admin/bookings">Booking queue</a>
    <a href="/admin/places">Places</a>
    <a href="/admin/requests" aria-current="page">Requests</a>
</nav>

<main class="admin">
    <div class="admin-head">
        <h1 class="admin-title">Lost links</h1>
    </div>

    <div class="admin-grid">
        <section class="admin-main" aria-label="Requests">
            <section class="admin-card" aria-labelledby="open-title">
                <h2 class="pl-card-title" id="open-title">Waiting <span class="pl-count" id="open-count"></span></h2>
                <ol class="pl-rows" id="open-rows"></ol>
                <p class="row-status" id="open-message" role="status" aria-live="polite" hidden></p>
            </section>

            <section class="admin-card" aria-labelledby="done-title" id="done-card" hidden>
                <h2 class="pl-card-title" id="done-title">Decided</h2>
                <ol class="pl-rows" id="done-rows"></ol>
            </section>
        </section>

        <aside class="sidebar" aria-label="Account">
            <section class="side-block" aria-labelledby="side-key-title">
                <h2 class="side-title" id="side-key-title">Signed in</h2>
                <p class="side-note" id="admin-email"></p>
                <button type="button" class="text-btn" id="sign-out-btn">Sign out</button>
            </section>
        </aside>
    </div>
</main>

<footer class="colophon">
    <p>Built by Fisher Kuan</p>
</footer>
<script src="/js/theme.js"></script>
<script src="/js/feedback.js"></script>
<script src="/js/sheet.js"></script>
<script src="/js/admin-session.js"></script>
<script src="/js/admin-requests.js"></script>
</body>
</html>
