<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ — Lilai</title>
    <meta name="description" content="Frequently asked questions about the Lilai web app.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container container-narrow">
    <div class="faq-topbar">
        <a class="faq-back" href="index.html" id="faq-back">← Back to events</a>
        <div class="faq-lang-toggle" role="group" aria-label="Language / 語言">
            <button type="button" class="filter-pill" data-lang="en" aria-pressed="false" lang="en">EN</button>
            <button type="button" class="filter-pill" data-lang="zh-TW" aria-pressed="false" lang="zh-Hant">繁中</button>
        </div>
    </div>

    <section class="faq-hero">
        <div class="eyebrow" id="faq-eyebrow">Frequently asked</div>
        <h1 class="display" id="faq-title">Questions, answered.</h1>
        <p id="faq-intro">Everything you might wonder about RSVPs, calendars, donations, and how this little app is run.</p>
    </section>

    <section class="faq-list" id="faq-content" aria-live="polite" aria-busy="true">
        <p class="loading" id="faq-loading">Loading FAQ...</p>
    </section>

    <footer class="bottom-banner">
        <div class="banner-content">
            <p class="copyright">&copy; Built by Fisher Kuan</p>
        </div>
    </footer>
</div>

<script src="js/faq.js"></script>
</body>
</html>
