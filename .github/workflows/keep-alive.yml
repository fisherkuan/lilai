name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days without database
# activity. This ping hits an endpoint that queries the database.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/events (queries the database)
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 30 \
            "https://lilai-6a9156ed4ccf.herokuapp.com/api/events?timeRange=future" \
            > /dev/null
