name: Weekly database backup

# Heroku keeps its own daily backups of the lilai-eu database, inside Heroku.
# This is the off-site copy: a weekly dump stored as an encrypted workflow
# artifact (90 days). The repo is public, so the dump is GPG-encrypted before upload.
#
# Heroku rotates Postgres credentials, so the URL is read from the Heroku API at
# run time. HEROKU_API_KEY is a `read-protected` authorization
# (heroku authorizations:create --scope read-protected).
#
# To restore: download the artifact, then
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" lilai-db-backup.sql.gz.gpg | gunzip | psql "$DATABASE_URL"
on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Look up the database URL
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -o pipefail
          url=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            https://api.heroku.com/apps/lilai-eu/config-vars | jq -r '.DATABASE_URL // empty')
          [ -n "$url" ] || { echo 'lilai-eu has no DATABASE_URL'; exit 1; }
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Dump the database
        # Without pipefail, gzip's success hid every pg_dump failure: the job
        # stayed green for weeks while dumping nothing.
        run: |
          set -o pipefail
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" \
            --no-owner --no-acl -n public \
            | gzip > lilai-db-backup.sql.gz

      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o lilai-db-backup.sql.gz.gpg lilai-db-backup.sql.gz
          rm lilai-db-backup.sql.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilai-db-backup-${{ github.run_id }}
          path: lilai-db-backup.sql.gz.gpg
          retention-days: 90
